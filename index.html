<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التشفير وفك التشفير</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>أداة التشفير وفك التشفير</h1>
        
        <div class="form-group">
            <label for="inputText">النص أو الكود:</label>
            <textarea id="inputText" placeholder="اكتب النص هنا..."></textarea>
        </div>

        <div class="buttons">
            <button onclick="encryptText()">تشفير (Base64)</button>
            <button onclick="decryptText()">فك التشفير</button>
            <button onclick="obfuscateCode()">حماية/تلغيم الكود (Obfuscate)</button>
            <button onclick="clearText()">مسح</button>
        </div>

        <div class="form-group">
            <label for="outputText">النتيجة:</label>
            <textarea id="outputText" readonly placeholder="ستظهر النتيجة هنا..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
