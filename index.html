<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetRex - منصة الأمن والذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .tab-active { background: linear-gradient(90deg, rgba(239,68,68,0.2) 0%, rgba(220,38,38,0.05) 100%); border-right: 4px solid #ef4444; color: #ffffff !important; }
        .glass-panel { background: rgba(22, 27, 34, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <header class="glass-panel sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center font-extrabold text-2xl text-white shadow-lg shadow-red-600/50">S</div>
                <span class="text-2xl font-black tracking-wider text-white">Set<span class="text-red-500">Rex</span></span>
            </div>
            <div class="flex items-center space-x-2 space-x-reverse text-sm font-semibold">
                <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-gray-400">النظام متصل (v2.0)</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside class="lg:col-span-1 space-y-3">
            <nav class="glass-panel rounded-2xl p-3 space-y-2 border border-gray-800">
                <button onclick="switchTab('ai')" id="tab-ai" class="tab-btn tab-active w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-robot text-lg text-red-500"></i>
                    <span>الذكاء الاصطناعي</span>
                </button>
                <button onclick="switchTab('crypto')" id="tab-crypto" class="tab-btn w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-lock text-lg text-red-500"></i>
                    <span>التشفير وفك التشفير</span>
                </button>
                <button onclick="switchTab('obfuscate')" id="tab-obfuscate" class="tab-btn w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-shield-halved text-lg text-red-500"></i>
                    <span>التلغيم وفك التلغيم</span>
                </button>
            </nav>
        </aside>

        <section class="lg:col-span-3">
            <!-- AI Tab -->
            <div id="content-ai" class="tab-content glass-panel rounded-2xl p-6 border border-gray-800 h-full flex flex-col justify-between min-h-[500px]">
                <div>
                    <div class="flex items-center space-x-3 space-x-reverse pb-4 border-b border-gray-800 mb-4">
                        <i class="fa-solid fa-brain text-2xl text-red-500"></i>
                        <h2 class="text-xl font-bold text-white">مساعد SetRex الذكي</h2>
                    </div>
                    <div id="ai-messages" class="space-y-4 max-h-[380px] overflow-y-auto pr-2">
                        <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 max-w-[85%]">
                            <p class="text-sm">مرحباً بك في منصة <span class="text-red-400 font-bold">SetRex</span>! كيف يمكنني مساعدتك؟</p>
                        </div>
                    </div>
                </div>
                <div class="mt-6 flex gap-2">
                    <input type="text" id="ai-input" placeholder="اكتب سؤالك هنا..." class="flex-1 bg-gray-900 border border-gray-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none">
                    <button onclick="sendAIMessage()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-xl transition">إرسال</button>
                </div>
            </div>

            <!-- Crypto Tab -->
            <div id="content-crypto" class="tab-content hidden glass-panel rounded-2xl p-6 border border-gray-800 space-y-6">
                <div class="flex items-center space-x-3 space-x-reverse pb-4 border-b border-gray-800">
                    <i class="fa-solid fa-key text-2xl text-red-500"></i>
                    <h2 class="text-xl font-bold text-white">مركز التشفير وفك التشفير</h2>
                </div>
                <div class="space-y-4">
                    <textarea id="crypto-input" rows="4" class="w-full bg-gray-900 border border-gray-700 text-white rounded-xl p-3 text-sm focus:outline-none" placeholder="أدخل النص هنا..."></textarea>
                    <div class="flex gap-3">
                        <button onclick="processBase64(true)" class="bg-red-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm">تشفير Base64</button>
                        <button onclick="processBase64(false)" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-semibold text-sm">فك تشفير Base64</button>
                    </div>
                    <textarea id="crypto-output" readonly rows="4" class="w-full bg-gray-950 text-green-400 font-mono rounded-xl p-3 text-sm" placeholder="النتيجة..."></textarea>
                </div>
            </div>

            <!-- Obfuscate Tab -->
            <div id="content-obfuscate" class="tab-content hidden glass-panel rounded-2xl p-6 border border-gray-800 space-y-6">
                <div class="flex items-center space-x-3 space-x-reverse pb-4 border-b border-gray-800">
                    <i class="fa-solid fa-bug-slash text-2xl text-red-500"></i>
                    <h2 class="text-xl font-bold text-white">مختبر التلغيم والتمويه (Obfuscation Lab)</h2>
                </div>
                <div class="space-y-4">
                    <textarea id="code-input" rows="5" class="w-full bg-gray-900 border border-gray-700 text-white font-mono rounded-xl p-3 text-sm focus:outline-none" placeholder="console.log('SetRex Security');"></textarea>
                    <div class="flex gap-3">
                        <button onclick="obfuscateCode()" class="bg-red-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm">تمويه وتلغيم الكود</button>
                        <button onclick="deobfuscateCode()" class="bg-gray-800 text-white px-5 py-2.5 rounded-xl font-semibold text-sm">فك التمويه</button>
                    </div>
                    <textarea id="code-output" readonly rows="5" class="w-full bg-gray-950 text-red-400 font-mono rounded-xl p-3 text-sm" placeholder="النتيجة المعالجة..."></textarea>
                </div>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('tab-active');
        }

        function sendAIMessage() {
            const input = document.getElementById('ai-input');
            const messages = document.getElementById('ai-messages');
            if (!input.value.trim()) return;
            messages.innerHTML += `<div class="bg-red-950/40 border border-red-900/50 p-4 rounded-xl max-w-[85%] mr-auto text-left"><p class="text-sm text-gray-200">${input.value}</p></div>`;
            input.value = '';
            setTimeout(() => {
                messages.innerHTML += `<div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 max-w-[85%]"><p class="text-sm">[SetRex AI]: تم استلام طلبك وبدء معالجته بنجاح.</p></div>`;
                messages.scrollTop = messages.scrollHeight;
            }, 500);
        }

        function processBase64(encode) {
            const input = document.getElementById('crypto-input').value;
            const output = document.getElementById('crypto-output');
            try {
                output.value = encode ? btoa(unescape(encodeURIComponent(input))) : decodeURIComponent(escape(atob(input)));
            } catch (e) { output.value = "خطأ في مدخلات التشفير!"; }
        }

        function obfuscateCode() {
            const input = document.getElementById('code-input').value;
            if(!input) return;
            const encoded = btoa(unescape(encodeURIComponent(input)));
            document.getElementById('code-output').value = `/* Obfuscated by SetRex */\neval(decodeURIComponent(escape(atob("${encoded}"))));`;
        }

        function deobfuscateCode() {
            const input = document.getElementById('code-input').value;
            const match = input.match(/atob\("([^"]+)"\)/);
            if (match && match[1]) {
                try { document.getElementById('code-output').value = decodeURIComponent(escape(atob(match[1]))); }
                catch(e) { document.getElementById('code-output').value = "تعذر فك الشفرة."; }
            } else { document.getElementById('code-output').value = "لم يتم العثور على صيغة مشفرة بـ SetRex."; }
        }
    </script>
</body>
</html>
