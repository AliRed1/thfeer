<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetRex - منصة الأمن والذكاء الاصطناعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="glass-panel sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center font-extrabold text-2xl text-white shadow-lg shadow-red-600/50">
                    S
                </div>
                <span class="text-2xl font-black tracking-wider text-white">Set<span class="text-red-500">Rex</span></span>
            </div>
            
            <div class="flex items-center space-x-2 space-x-reverse text-sm font-semibold">
                <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-gray-400">النظام متصل (v2.0)</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-1 space-y-3">
            <nav class="glass-panel rounded-2xl p-3 space-y-2 border border-gray-800">
                <button onclick="switchTab('ai')" id="tab-ai" class="tab-btn tab-active w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition duration-200">
                    <i class="fa-solid fa-robot text-lg text-red-500"></i>
                    <span>الذكاء الاصطناعي</span>
                </button>

                <button onclick="switchTab('crypto')" id="tab-crypto" class="tab-btn w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition duration-200">
                    <i class="fa-solid fa-lock text-lg text-red-500"></i>
                    <span>التشفير وفك التشفير</span>
                </button>

                <button onclick="switchTab('obfuscate')" id="tab-obfuscate" class="tab-btn w-full text-right p-3.5 rounded-xl flex items-center space-x-3 space-x-reverse font-bold text-gray-400 hover:text-white hover:bg-gray-800/50 transition duration-200">
                    <i class="fa-solid fa-shield-halved text-lg text-red-500"></i>
                    <span>التلغيم وفك التلغيم</span>
                </button>
            </nav>

            <div class="glass-panel rounded-2xl p-4 border border-gray-800 text-xs text-gray-400 space-y-2">
                <div class="flex items-center space-x-2 space-x-reverse text-red-400 font-bold">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>نبذة عن SetRex</span>
                </div>
                <p>منصة أدوات متقدمة تحوي الذكاء الاصطناعي، وأدوات الحماية والتشفير وتحليل البرمجيات.</p>
            </div>
        </aside>

        <!-- Dynamic Content Sections -->
        <section class="lg:col-span-3">

            <!-- TAB 1: AI Assistant -->
            <div id="content-ai" class="tab-content glass-panel rounded-2xl p-6 border border-gray-800 h-full flex flex-col justify-between min-h-[500px]">
                <div>
                    <div class="flex items-center space-x-3 space-x-reverse pb-4 border-b border-gray-800 mb-4">
                        <i class="fa-solid fa-brain text-2xl text-red-500"></i>
                        <h2 class="text-xl font-bold text-white">مساعد SetRex الذكي</h2>
                    </div>
                    <div id="ai-messages" class="space-y-4 max-h-[380px] overflow-y-auto pr-2">
                        <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 max-w-[85%]">
                            <p class="text-sm">مرحباً بك في منصة <span class="text-red-400 font-bold">SetRex</span>! كيف يمكنني مساعدتك اليوم في التشفير أو البرمجة؟</p>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex gap-2">
                    <input type="text" id="ai-input" placeholder="اكتب سؤالك هنا..." class="flex-1 bg-gray-900 border border-gray-700 focus:border-red-500 text-white rounded-xl px-4
